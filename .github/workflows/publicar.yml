# Duna Press — publicação no GitHub Pages.
#
# O site é reconstruído a cada alteração em artigos/, src/, assets/ ou
# editorial/, conferido, e só então publicado. Se a conferência reprovar,
# o deploy não acontece e o site no ar permanece intacto.

name: Publicar

on:
  push:
    branches: [main]
    paths:
      - 'artigos/**'
      - 'src/**'
      - 'assets/**'
      - 'editorial/**'
      - 'dados/excecoes.txt'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Migrar acervo
        run: python3 src/migrar.py

      - name: Classificar indexação
        run: python3 src/classificar.py

      - name: Gerar site
        run: python3 src/gerar.py

      - name: Conferir a saída
        env:
          # GitHub Pages não tem teto de arquivos como o Cloudflare.
          # O limite real é 1 GB de publicação; avisamos bem antes disso.
          DP_TETO_ARQUIVOS: '250000'
        run: python3 tools/conferir_build.py

      - name: Preparar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

      # O cache do edge guarda o HTML por tempo longo, o que só é aceitável
      # porque limpamos aqui. Sem este passo, uma notícia publicada agora
      # levaria horas para aparecer para quem já visitou o site.
      #
      # Falha aqui não derruba a publicação: o site já está no ar, e cache
      # velho é problema menor que um deploy marcado como quebrado.
      - name: Limpar o cache do edge
        continue-on-error: true
        env:
          ZONA: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$ZONA" ] || [ -z "$TOKEN" ]; then
            echo "Segredos da Cloudflare ausentes; cache não foi limpo."
            exit 0
          fi
          # So o que muda a cada publicacao. A versao anterior usava
          # purge_everything e, com 6 a 10 materias por dia mais o cron
          # diario, o cache das 20 mil paginas nunca aquecia: era a causa
          # dos 15% de taxa de acerto. Materia nova e URL nova, nunca
          # esteve em cache e nao precisa de purge.
          ALVOS='"https://dunapress.org/","https://dunapress.org/sitemap.xml","https://dunapress.org/rss.xml","https://dunapress.org/arquivo/","https://dunapress.org/autores/","https://dunapress.org/api/busca.json","https://dunapress.org/api/artigos.json"'
          for s in brasil mundo economia politica ciencia-e-saude \
                   tecnologia cultura esportes opiniao; do
            ALVOS="$ALVOS,\"https://dunapress.org/$s/\""
          done

          resposta=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/$ZONA/purge_cache" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"files\":[$ALVOS]}")
          echo "$resposta"
          echo "$resposta" | grep -q '"success":true' \
            && echo "Cache limpo." \
            || { echo "Purge recusado pela Cloudflare."; exit 1; }
