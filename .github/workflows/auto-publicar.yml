# Duna Press — publicação automática de Brasil e Mundo.
#
# Roda sozinho, sem revisão humana prévia. As barreiras estão em
# src/auto_publicar.py: fonte real buscada na hora, verificação de cada
# afirmação contra a fonte, recusa de texto que só reescreve o original, e
# conferência de forma. Nada disso substitui julgamento editorial sobre
# relevância — por isso o volume é baixo e tudo entra em fila de conferência.

name: Publicar automático

on:
  schedule:
    # 07h de Brasília — meio-dia em Oslo, onde o editor lê o jornal.
    # O GitHub costuma atrasar o agendador; a segunda execução cobre isso.
    - cron: '0 10,11 * * 1-5'
  workflow_dispatch:
    inputs:
      secao:
        description: 'nacional, internacional ou ambos'
        required: false
        default: 'ambos'

concurrency:
  group: auto-publicar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Identificar o autor dos commits
        run: |
          git config user.name  "Duna Press (automático)"
          git config user.email "redacao@dunapress.org"

      - name: Publicar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DP_TETO_AUTO: '2'
          DP_TETO_TENTATIVAS: '3'
          DP_TETO_MENSAL: '5.00'
          DP_JANELA_DIAS: '4'
        run: |
          if [ "${{ inputs.secao }}" = "ambos" ] || [ -z "${{ inputs.secao }}" ]; then
            python3 src/auto_publicar.py
          else
            python3 src/auto_publicar.py --so "${{ inputs.secao }}"
          fi

      # O acumulado de gasto precisa persistir entre execuções, senão o teto
      # nunca freia: cada rodada começaria do zero.
      - name: Registrar o gasto
        if: always()
        run: |
          if [ -n "$(git status --porcelain dados/custo-api.json)" ]; then
            git add dados/custo-api.json
            git commit -m "chore: gasto acumulado da API"
            git push origin HEAD
          fi
