# Duna Press — publicação automática: educação escandinava.
#
# Uma matéria por dia útil, de fonte institucional nórdica, publicada fora
# da capa: entra no acervo, não no índice. Roda sozinho, sem revisão humana
# prévia. As barreiras estão em src/auto_publicar.py: fato filtrado por
# tema e região antes de qualquer chamada, fonte real buscada na hora,
# verificação de cada afirmação contra a fonte, recusa de texto que só
# reescreve o original, e conferência de forma. Tudo entra em fila de
# conferência posterior.

name: Publicar automático

on:
  schedule:
    # Meio-dia em Oslo, que é o fuso do jornal. O cron do GitHub só entende
    # UTC e não conhece horário de verão, então as duas marcas cobrem o ano:
    #   10:00 UTC → 12:00 em Oslo no horário de verão (CEST, +2)
    #   11:00 UTC → 12:00 em Oslo no horário padrão  (CET,  +1)
    # A marca fora da estação também serve de segunda tentativa: o GitHub
    # costuma atrasar o agendador em 20 a 40 minutos. Com teto de 1, a
    # segunda execução só age se a primeira não publicou.
    - cron: '0 10,11 * * 1-5'
  workflow_dispatch:

concurrency:
  group: auto-publicar
  cancel-in-progress: false

permissions:
  contents: write

# O jornal opera em horário de Oslo. Sem isto, o runner lê UTC e o bot
# calcula "hoje" com uma ou duas horas de atraso.
env:
  TZ: Europe/Oslo

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Identificar o autor dos commits
        run: |
          git config user.name  "Duna Press (automático)"
          git config user.email "redacao@dunapress.org"

      - name: Publicar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
          # Uma matéria por dia. O teto conta só publicação automática.
          DP_TETO_AUTO: '1'
          # Cada tentativa custa, aprovada ou não.
          DP_TETO_TENTATIVAS: '3'
          DP_TETO_MENSAL: '5.00'
          # Ministério de educação não publica todo dia: janela larga.
          DP_JANELA_DIAS: '14'
          # Uma matéria por dia cabe conferir inteira.
          DP_AMOSTRA_VERIF: '1.0'
        run: python3 src/auto_publicar.py

      # O acumulado de gasto precisa persistir entre execuções, senão o teto
      # nunca freia: cada rodada começaria do zero.
      - name: Registrar o gasto
        if: always()
        run: |
          if [ -n "$(git status --porcelain dados/custo-api.json)" ]; then
            git add dados/custo-api.json
            git commit -m "chore: gasto acumulado da API"
            git push origin HEAD
          fi
