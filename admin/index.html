<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Redação — Duna Press</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<style>
  /* Enquanto o painel carrega, a tela fica branca. Um aviso evita a
     sensação de que o endereço quebrou. */
  #carregando{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",
    Helvetica,Arial,sans-serif;color:#5A5F67;padding:80px 24px;text-align:center}
  #carregando b{display:block;font-family:Georgia,serif;font-size:30px;
    color:#15171B;margin-bottom:10px;letter-spacing:-.02em}
</style>
</head>
<body>
<div id="carregando"><b>Duna Press</b>Abrindo a redação…</div>
<script src="https://unpkg.com/decap-cms@^3.8.4/dist/decap-cms.js"></script>
<script>
  window.addEventListener("load", function () {
    var aviso = document.getElementById("carregando");
    if (aviso) aviso.remove();
  });
</script>
</body>
</html>
